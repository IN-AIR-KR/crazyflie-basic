# Qualisys mocap 기반 멀티 기체 설정 (crazyflies_mocap.yaml 의 2대 버전).
# crazyswarm2 crazyflies.yaml 포맷(fileversion 3)을 따른다.
#
# mocap 은 모든 기체가 같은 절대좌표계(QTM 월드)를 공유하므로, Flow deck 멀티
# 비행과 달리 기체별 goTo 를 자유롭게 쓸 수 있다 — formation_flight.py 의
# absolute 모드(대열 모양 변경 가능)가 여기서 비로소 실기체로 동작한다.
#
# ⚠️ 필수: QTM 에서 이 기체들의 rigid body(AIM) 이름을 아래 로봇 이름과
#    정확히 똑같이(cf1, cf2) 만들어야 pose 매칭이 된다. 이름이 다르면
#    motion_capture_tracking 노드가 이 기체의 pose 를 못 받는다.
# ⚠️ Active Marker Deck 을 쓰면 기체마다 고유 마커 ID 로 QTM AIM 캘리브레이션을
#    따로 해줘야 한다 — 두 기체가 같은 ID 면 QTM 이 구분을 못 한다.
# ⚠️ initial_position 은 mocap 월드 원점 기준 실제 배치 좌표로 교체할 것
#    (opticalflow_multi.yaml 과 달리 여기선 실제로 쓰인다 — 실기체는 C++ 서버가
#    mocap pose 를 그대로 TF 로 내보내므로 원점이 QTM 캘리브레이션 원점이다).
fileversion: 3

robots:
  cf1:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E7E5
    initial_position: [0.0, -0.5, 0.0] # TODO: mocap 월드 기준 실제 좌표로 교체
    type: cf21_active
  cf2:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E7E7
    initial_position: [0.0, 0.5, 0.0] # TODO: mocap 월드 기준 실제 좌표로 교체
    type: cf21_active

robot_types:
  cf21_active:
    # Active Marker Deck + Qualisys: QTM 이 마커 ID 로 rigid body(6DOF)를 직접 산출 -> vendor.
    motion_capture:
      enabled: true
      tracking: "vendor" # mocap 소프트웨어(QTM)가 주는 6DOF 사용
    big_quad: false
    battery:
      voltage_warning: 3.8
      voltage_critical: 3.7

all:
  reference_frame: "world"
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2 # 2 = Kalman (mocap 사용 시 필수)
      controller: 2 # 2 = Mellinger
  firmware_logging:
    enabled: true
    default_topics:
      pose:
        frequency: 50 # Hz — mocap 기반 상태추정 결과
      status:
        frequency: 1 # Hz — 배터리/통신 상태 (voltage_warning 감시에 필요)
