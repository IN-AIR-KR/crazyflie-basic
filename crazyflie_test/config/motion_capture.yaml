# motion_capture_tracking 노드 설정 (mode:=mocap 일 때만 쓰인다).
# crazyswarm2 원본 crazyflie/config/motion_capture.yaml 을 Qualisys 용으로 줄인 것.
# ⚠️ hostname 은 QTM 이 도는 PC 의 IP 로 반드시 교체할 것.
/motion_capture_tracking:
  ros__parameters:
    # "optitrack" | "vicon" | "qualisys" | "nokov" | "vrpn" | "motionanalysis"
    type: "qualisys"
    hostname: "192.168.0.200" # TODO: QTM 실행 PC IP 로 교체

    topics:
      frame_id: "mocap"
      poses:
        qos:
          mode: "sensor"
          deadline: 100.0 # Hz
      tf:
        child_frame_id: "{}_mocap"

    # crazyflies_mocap.yaml 의 robot_types 가 tracking: "vendor" 이면(=QTM 이 6DOF 를
    # 직접 계산) 아래 마커 배치는 쓰이지 않는다. librigidbodytracker 로 바꿀 때만 필요.
    marker_configurations:
      default: # 표준 Crazyflie 반사마커 배치
        offset: [0.0, 0.0, 0.0]
        points:
          p0: [0.0, 0.0, 0.022] # top
          p1: [-0.042, 0.042, 0.0] # back left   (M3)
          p2: [-0.042, -0.042, 0.0] # back right  (M2)
          p3: [0.042, -0.042, 0.0] # front right (M1)

    dynamics_configurations:
      default:
        max_velocity: [2.0, 2.0, 3.0] # m/s
        max_angular_velocity: [20.0, 20.0, 10.0] # rad/s
        max_roll: 1.4 # rad
        max_pitch: 1.4 # rad
        max_fitness_score: 0.001

    # rigid_bodies 는 launch 파일이 crazyflies.yaml 을 읽어 자동 생성한다.
