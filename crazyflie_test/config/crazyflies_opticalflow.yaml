# Flow deck 온보드 추정 모드용 로봇 설정 (mocap 노드 미사용).
# crazyswarm2 crazyflies.yaml 포맷(fileversion 3)을 따른다.
# ⚠️ URI / initial_position 은 실제 값으로 교체할 것.
fileversion: 3

robots:
  cf231:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E7E7
    initial_position: [0.0, 0.0, 0.0]
    type: cf21_flow

robot_types:
  cf21_flow:
    motion_capture:
      enabled: false                      # mocap 미사용
      tracking: "vendor"
    big_quad: false
    battery:
      voltage_warning: 3.8
      voltage_critical: 3.7

all:
  reference_frame: "world"
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2      # Kalman
      controller: 1     # 1 = PID — Flow deck 사용 시 Mellinger보다 안정적
  firmware_logging:
    enabled: true
    default_topics:
      pose:
        frequency: 10   # Hz — RViz 시각화용. avoid.py/formation_teleop 는 pose 를 안 써서 낮춰도 무방
      status:
        frequency: 1    # Hz — 배터리/통신 상태 (voltage_warning 감시에 필요)
      scan:
        frequency: 10   # Hz — 멀티레인저 전후좌우 거리 (avoid.py 가 구독).
        # ⚠️ pose(원래 50)+scan+status 합산 다운링크 트래픽이 라디오 1개로
        #    감당하기 빠듯해서 "Too many packets lost" 끊김의 원인이 될 수
        #    있다 — 낮춰서 여유를 둠. 그래도 끊기면 더 낮출 것.
